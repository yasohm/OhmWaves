  <!-- Non-blocking so nothing (including the launch screen) waits on the network to paint. -->

  <!--
    Launch screen for the phone app (Capacitor adds "OhmWavesApp" to its user agent). Android's own splash draws
    the OhmWaves mark while the app starts (drawable-v31/splash_icon.xml, MainActivity); this page paints the same
    mark underneath, reports in (Launch.ready), and when Android hands over (ohmLaunchReveal) the waves flow in
    along the bottom. It fades out once the app has rendered. Add ?launch to preview it in a browser.
    The waves only move with transform/opacity, so the GPU keeps them smooth while the app starts.
  -->
  <style>
    .launch { display: none; }
    .is-app .launch { position: fixed; inset: 0; z-index: 1000; display: block; overflow: hidden; background: #0f0f0e; transition: opacity 280ms ease-out; will-change: opacity; }
    .launch.is-leaving { opacity: 0; }
    /* Same size and spot as Android's splash logo (144dp wide, centred); MainActivity sends the exact centre. */
    .launch__mark { position: absolute; left: var(--launch-x, 50%); top: var(--launch-y, 50%); width: 144px; color: #ff6a2b; transform: translate(-50%, -50%); }
    .launch__layer { position: absolute; bottom: 0; left: 0; width: 200%; height: 42%; opacity: 0; will-change: transform, opacity; }
    .launch.is-revealed .launch__layer { animation: launch-rise 700ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards, launch-flow var(--speed) linear infinite; }
    .launch__layer svg { display: block; width: 100%; height: 100%; }
    .launch__layer path { fill: none; vector-effect: non-scaling-stroke; }
    .launch__layer--back { --speed: 16s; }
    .launch.is-revealed .launch__layer--mid { --speed: 11s; animation-delay: 60ms, 0s; }
    .launch.is-revealed .launch__layer--front { --speed: 7s; animation-delay: 120ms, 0s; }
    @keyframes launch-rise { from { opacity: 0; translate: 0 24px; } to { opacity: 1; translate: 0 0; } }
    @keyframes launch-flow { to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) {
      .launch.is-revealed .launch__layer { animation: none; opacity: 1; }
    }
  </style>
  <script>
    (function () {
      var native = /OhmWavesApp/.test(navigator.userAgent);
      window.ohmLaunchReady = Promise.resolve();
      if (!native && !/[?&]launch\b/.test(location.search)) return;
      document.documentElement.classList.add('is-app');
      var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      var minShow = still ? 300 : 1000; // time the waves get on screen after Android hands over
      var revealedAt = null, wanted = false, leaving = false, startApp;
      // The app boots once Android hands over, so it never competes with the handover itself.
      window.ohmLaunchReady = new Promise(function (resolve) { startApp = resolve; });

      function leave() {
        var el = document.getElementById('launch');
        if (!el) return;
        el.classList.add('is-leaving');
        setTimeout(function () { el.remove(); }, 320);
      }
      function maybeLeave() {
        if (leaving || !wanted || revealedAt === null) return;
        leaving = true;
        setTimeout(leave, Math.max(0, revealedAt + minShow - performance.now()));
      }
      /** Called by MainActivity as its splash fades: (x, y) is the splash logo's centre in CSS pixels. */
      window.ohmLaunchReveal = function (x, y) {
        if (revealedAt !== null) return;
        var el = document.getElementById('launch');
        if (!el && document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () { window.ohmLaunchReveal(x, y); });
          return;
        }
        if (el && x != null) { el.style.setProperty('--launch-x', x + 'px'); el.style.setProperty('--launch-y', y + 'px'); }
        if (el) el.classList.add('is-revealed');
        revealedAt = performance.now();
        startApp();
        maybeLeave();
      };
      /** Called by main.jsx once the app has rendered. */
      window.ohmLaunchDone = function () { wanted = true; maybeLeave(); };
      // In the app this only matters if Android's handover never arrives (browser preview reveals in <body>).
      if (native) setTimeout(window.ohmLaunchReveal, 4000);
      setTimeout(leave, 9000); // never trap the user if the app fails to start
    })();
  </script>

  <script>
    // Tell Android the launch screen is on screen (after it has actually painted) so its splash can hand over.
    // The browser preview has no Android splash, so it starts the waves straight away.
    (function () {
      if (!/OhmWavesApp/.test(navigator.userAgent)) { if (window.ohmLaunchReveal) window.ohmLaunchReveal(); return; }
      var tries = 0;
      function report() {
        var cap = window.Capacitor;
        if (cap && cap.nativePromise) { cap.nativePromise('Launch', 'ready').catch(function () {}); return; }
        if (++tries < 40) setTimeout(report, 50);
      }
      requestAnimationFrame(function () { requestAnimationFrame(report); });
    })();
  </script>
